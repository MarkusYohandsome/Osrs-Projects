services:
  backend:
    build:
      context: .
      dockerfile: BackEnd/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
    volumes:
      - ./BackEnd:/src:cached
    networks:
      - app-network

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./FrontEnd/src:/app/src:cached
    networks:
      - app-network

networks:
  app-network:
    driver: bridge