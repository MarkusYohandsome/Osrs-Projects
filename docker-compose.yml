services:
  backend:
    image: osrs-projects-backend:${BUILD_TAG}
    build:
      context: .
      dockerfile: BackEnd/Dockerfile
      args:
        BUILD_TAG: ${BUILD_TAG}
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_SERVER=${DB_SERVER}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./BackEnd:/src:cached
    networks:
      - app-network

  frontend:
    image: osrs-projects-frontend:${BUILD_TAG}
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        BUILD_TAG: ${BUILD_TAG}
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./FrontEnd/src:/app/src:cached
    networks:
      - app-network

networks:
  app-network:
    driver: bridge